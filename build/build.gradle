import org.gradle.api.tasks.Exec

task initDOT {
   String projectDir = "."
   doLast {
   if(! new File("${projectDir}/dita-ot/oxygen-publishing-engine/").exists()){
       //https://www.oxygenxml.com/InstData/PublishingEngine/oxygen-publishing-engine.zip
       //https://archives.oxygenxml.com/Nightly/PublishingEngine/oxygen-publishing-engine.zip
       ant.get(src: 'https://www.oxygenxml.com/InstData/PublishingEngine/oxygen-publishing-engine.zip', dest: "${projectDir}/dita-ot.zip", skipexisting: 'true')
       ant.unzip(src: "${projectDir}/dita-ot.zip", dest: 'dita-ot')
       new File("${projectDir}/dita-ot/oxygen-publishing-engine/licensekey.txt").write(System.getenv( 'LICENSE_KEY' ).replaceAll("  ", "\n"))
    }
  }
}

def ditaHome = "${projectDir}/dita-ot/oxygen-publishing-engine"
def ditaBin = "${ditaHome}/bin"
def ditaCmd = "${ditaBin}/dita"
def projectFile = "${projectDir}/../blog-project.xml"
def pdfOutDir = file("${ditaBin}/pdf-out")

task runWebhelp(type:Exec, dependsOn: [initDOT]) {
 workingDir ditaBin
 environment "ANT_OPTS", "-Xmx4g"
 commandLine "sh", ditaCmd, "--output=.", "--project", projectFile, "--deliverable=wh-responsive"
}

task runEpub(type:Exec, dependsOn: [runWebhelp]) {
 workingDir ditaBin
 environment "ANT_OPTS", "-Xmx4g"
 commandLine "sh", ditaCmd, "--output=.", "--project", projectFile, "--deliverable=epub"
}

task runPdf(type:Exec, dependsOn: [runEpub]) {
 workingDir ditaBin
 environment "ANT_OPTS", "-Xmx2g"
 ignoreExitValue = true
 commandLine "sh", ditaCmd, "--output=.", "--project", projectFile, "--deliverable=pdf", "-DbaseJVMArgLine=-Xmx4g"
 doLast {
    def code = executionResult.get().exitValue
    if (code != 0) {
        logger.warn("PDF Chemistry failed with exit code ${code}. Publishing WebHelp and EPUB without oxygen_xml_blog.pdf.")
    }
 }
}

task copyPdf(type: Copy, dependsOn: [runPdf]) {
    from pdfOutDir
    include "*.pdf"
    into "${ditaBin}/site"
    onlyIf { pdfOutDir.exists() && !fileTree(pdfOutDir).include("*.pdf").files.isEmpty() }
}

task copySite(type: Copy, dependsOn: [copyPdf]) {
    from "${ditaBin}/site"
    into "${projectDir}/../site"
}

task copyResources(type: Copy) {
    from "${projectDir}/../resources/"
    into "${projectDir}/../site/resources"
}

task dist(dependsOn: [copySite, copyResources])

defaultTasks 'dist'
