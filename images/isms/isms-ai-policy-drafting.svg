<title>Policies drafted with AI Positron and reviewed in a loop</title>
<desc>Policy stubs and the current controls, collected from the CTO and the system administrators, go to AI Positron in Content Fusion, which drafts the policies. Drafts and reviews go round in a loop until the policies are approved; the resulting policy files are linked from the Statement of Applicability.</desc>
