<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="330" viewBox="0 0 800 330" role="img" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>SOPs pushed from the wiki repository to the ticketing system</title>
<desc>SOPs are edited and reviewed in Content Fusion and stored in the Git wiki repository. The ISMS web app (Python) reads them and shows each person a catalog filtered by role; its Push button sends an SOP to the ticketing system as a work item that people carry out and close.</desc>
