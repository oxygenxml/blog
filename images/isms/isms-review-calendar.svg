<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="340" viewBox="0 0 800 340" role="img" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Scheduling driven by document metadata</title>
<desc>SOPs and policies in the Git repository carry scheduling metadata: start date, repeat interval and review period. The ISMS web app turns it into a calendar of SOP runs and document reviews, and emails the people named in each RACI table when an SOP is due or a document needs review.</desc>
