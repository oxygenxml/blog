<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="604" viewBox="0 0 800 604" role="img" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>The translation workflow</title>
<desc>Five steps, repeated for every release. Step 1, branch; step 2, update the translation resources for the release: the UI strings, the terminology, and the project rules, which guide every translation job; step 3, translate, which is an AI translation job followed by a quick check of the changed files before the commit; step 4, review, which is an AI review and an expert review; and step 5, integrate and publish. Issues found by the reviews are fixed at their cause, and the affected topics are translated again.</desc>
