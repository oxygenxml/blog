<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 600" width="1010" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>AI translation workflow for a user manual</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/>
    </marker>
    <style>
      .label { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; fill: #6B7280; }
      .title { font-size: 15px; font-weight: 700; fill: #111827; }
      .sub { font-size: 12px; fill: #374151; }
      .note { font-size: 12px; fill: #4B5563; font-style: italic; }
      .human { fill: #EAF2FB; stroke: #2F6DB5; stroke-width: 1.5; }
      .ai { fill: #E8F5EE; stroke: #2E8B57; stroke-width: 1.5; }
      .setup { fill: #FFFFFF; stroke: #7C6CD9; stroke-width: 1.5; }
      .fix { fill: #FFF4E5; stroke: #C2410C; stroke-width: 1.5; }
      .line { fill: none; stroke: #4B5563; stroke-width: 1.6; }
      .loop { fill: none; stroke: #C2410C; stroke-width: 1.6; }
      .release { fill: none; stroke: #6B7280; stroke-width: 1.6; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="1010" height="600" fill="#FFFFFF"/>

  <!-- Legend -->
  <rect x="770" y="48" width="16" height="16" rx="3" class="ai"/>
  <text x="794" y="61" class="sub">Done by the AI agent</text>
  <rect x="770" y="74" width="16" height="16" rx="3" class="human"/>
  <text x="794" y="87" class="sub">Done by you or a reviewer</text>
  <rect x="770" y="100" width="16" height="16" rx="3" class="setup"/>
  <text x="794" y="113" class="sub">Translation resources</text>

  <!-- Setup band -->
  <rect x="100" y="30" width="620" height="150" rx="10" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1"/>
  <text x="120" y="54" class="label">SET UP ONCE PER PRODUCT AND LANGUAGE</text>

  <rect x="120" y="70" width="180" height="90" rx="8" class="setup"/>
  <text x="210" y="102" text-anchor="middle" class="title">UI strings</text>
  <text x="210" y="122" text-anchor="middle" class="sub">generated from the</text>
  <text x="210" y="138" text-anchor="middle" class="sub">localized product</text>

  <rect x="320" y="70" width="180" height="90" rx="8" class="setup"/>
  <text x="410" y="102" text-anchor="middle" class="title">Terminology</text>
  <text x="410" y="122" text-anchor="middle" class="sub">approved terms,</text>
  <text x="410" y="138" text-anchor="middle" class="sub">curated by hand</text>

  <rect x="520" y="70" width="180" height="90" rx="8" class="setup"/>
  <text x="610" y="102" text-anchor="middle" class="title">Project rules</text>
  <text x="610" y="122" text-anchor="middle" class="sub">style and typography</text>
  <text x="610" y="138" text-anchor="middle" class="sub">for every job</text>

  <path d="M256,180 L256,258" class="line" marker-end="url(#arrow)"/>
  <text x="266" y="226" class="note">guide every job</text>

  <!-- Main cycle -->
  <text x="20" y="246" class="label">EVERY RELEASE</text>

  <rect x="20" y="260" width="140" height="90" rx="8" class="human"/>
  <text x="90" y="292" text-anchor="middle" class="title">1. Branch</text>
  <text x="90" y="312" text-anchor="middle" class="sub">isolate the</text>
  <text x="90" y="328" text-anchor="middle" class="sub">translation work</text>

  <rect x="186" y="260" width="140" height="90" rx="8" class="ai"/>
  <text x="256" y="292" text-anchor="middle" class="title">2. Translate</text>
  <text x="256" y="312" text-anchor="middle" class="sub">only missing and</text>
  <text x="256" y="328" text-anchor="middle" class="sub">changed topics</text>

  <rect x="352" y="260" width="140" height="90" rx="8" class="human"/>
  <text x="422" y="292" text-anchor="middle" class="title">3. Check</text>
  <text x="422" y="312" text-anchor="middle" class="sub">changed files,</text>
  <text x="422" y="328" text-anchor="middle" class="sub">valid DITA, commit</text>

  <rect x="518" y="260" width="140" height="90" rx="8" class="ai"/>
  <text x="588" y="292" text-anchor="middle" class="title">4. AI review</text>
  <text x="588" y="312" text-anchor="middle" class="sub">every topic,</text>
  <text x="588" y="328" text-anchor="middle" class="sub">root-cause report</text>

  <rect x="684" y="260" width="140" height="90" rx="8" class="human"/>
  <text x="754" y="292" text-anchor="middle" class="title">6. Expert review</text>
  <text x="754" y="312" text-anchor="middle" class="sub">meaning and style,</text>
  <text x="754" y="328" text-anchor="middle" class="sub">bilingual reviewer</text>

  <rect x="850" y="260" width="140" height="90" rx="8" class="human"/>
  <text x="920" y="292" text-anchor="middle" class="title">7. Publish</text>
  <text x="920" y="312" text-anchor="middle" class="sub">merge, tag,</text>
  <text x="920" y="328" text-anchor="middle" class="sub">build deliverables</text>

  <path d="M160,305 L184,305" class="line" marker-end="url(#arrow)"/>
  <path d="M326,305 L350,305" class="line" marker-end="url(#arrow)"/>
  <path d="M492,305 L516,305" class="line" marker-end="url(#arrow)"/>
  <path d="M658,305 L682,305" class="line" marker-end="url(#arrow)"/>
  <path d="M824,305 L848,305" class="line" marker-end="url(#arrow)"/>
  <text x="671" y="254" text-anchor="middle" class="note">clean</text>

  <!-- Quality loop -->
  <rect x="352" y="420" width="140" height="90" rx="8" class="fix"/>
  <text x="422" y="452" text-anchor="middle" class="title">5. Fix the cause</text>
  <text x="422" y="472" text-anchor="middle" class="sub">terms, UI strings,</text>
  <text x="422" y="488" text-anchor="middle" class="sub">rules, or the topic</text>

  <path d="M588,350 L588,465 L494,465" class="loop" marker-end="url(#arrow-orange)"/>
  <text x="598" y="410" class="note" fill="#C2410C">issues found</text>
  <path d="M352,465 L256,465 L256,352" class="loop" marker-end="url(#arrow-orange)"/>
  <text x="266" y="410" class="note" fill="#C2410C">retranslate</text>
  <text x="422" y="400" text-anchor="middle" class="label" fill="#C2410C">QUALITY LOOP</text>

  <!-- Release loop -->
  <path d="M920,350 L920,560 L90,560 L90,352" class="release" marker-end="url(#arrow)"/>
  <rect x="300" y="549" width="410" height="22" fill="#FFFFFF"/>
  <text x="505" y="565" text-anchor="middle" class="note">next release: only the topics whose source changed are translated again</text>
</svg>
