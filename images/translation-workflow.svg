<linearGradient id="tr-workflow-git" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5e6573"/><stop offset="1" stop-color="#434850"/></linearGradient>
<linearGradient id="tr-workflow-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#149aa6"/><stop offset="1" stop-color="#01929e"/></linearGradient>
</defs>
