<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 600" width="1010" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>The translation workflow</title>
  <desc>Five steps, repeated for every release. Step 1, branch; step 2, update the translation resources for the
    release: the UI strings, the terminology, and the project rules, which guide every translation job; step 3,
    translate, which is an AI translation job followed by a quick check of the changed files before the commit;
    step 4, review, which is an AI review and an expert review; and step 5, integrate and publish. Issues found by the reviews are fixed at their cause, and the affected topics are translated again.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/>
    </marker>
    <style>
      .label { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; fill: #6B7280; }
      .title { font-size: 15px; font-weight: 700; fill: #111827; }
      .sub { font-size: 12px; fill: #374151; }
      .note { font-size: 12px; fill: #4B5563; font-style: italic; }
      .human { fill: #EAF2FB; stroke: #2F6DB5; stroke-width: 1.5; }
      .ai { fill: #E8F5EE; stroke: #2E8B57; stroke-width: 1.5; }
      .setup { fill: #FFFFFF; stroke: #7C6CD9; stroke-width: 1.5; }
      .fix { fill: #FFF4E5; stroke: #C2410C; stroke-width: 1.5; }
      .line { fill: none; stroke: #4B5563; stroke-width: 1.6; }
      .loop { fill: none; stroke: #C2410C; stroke-width: 1.6; }
      .release { fill: none; stroke: #6B7280; stroke-width: 1.6; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="1010" height="600" fill="#FFFFFF"/>

  <!-- Legend -->
  <rect x="770" y="48" width="16" height="16" rx="3" class="ai"/>
  <text x="794" y="61" class="sub">Done by the AI agent</text>
  <rect x="770" y="74" width="16" height="16" rx="3" class="human"/>
  <text x="794" y="87" class="sub">Done by you or a reviewer</text>
  <rect x="770" y="100" width="16" height="16" rx="3" class="setup"/>
  <text x="794" y="113" class="sub">Translation resources</text>

  <!-- Every release -->
  <text x="20" y="40" class="label">EVERY RELEASE</text>

  <!-- Step 2: translation resources, updated for each release -->
  <rect x="160" y="24" width="590" height="156" rx="10" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1"/>
  <text x="180" y="52" class="title">2. Prepare resources</text>
  <text x="730" y="52" text-anchor="end" class="note">update them for this release</text>

  <rect x="180" y="70" width="170" height="90" rx="8" class="setup"/>
  <text x="265" y="102" text-anchor="middle" class="title">UI strings</text>
  <text x="265" y="122" text-anchor="middle" class="sub">generated from the</text>
  <text x="265" y="138" text-anchor="middle" class="sub">localized product</text>

  <rect x="370" y="70" width="170" height="90" rx="8" class="setup"/>
  <text x="455" y="102" text-anchor="middle" class="title">Terminology</text>
  <text x="455" y="122" text-anchor="middle" class="sub">approved terms,</text>
  <text x="455" y="138" text-anchor="middle" class="sub">curated by hand</text>

  <rect x="560" y="70" width="170" height="90" rx="8" class="setup"/>
  <text x="645" y="102" text-anchor="middle" class="title">Project rules</text>
  <text x="645" y="122" text-anchor="middle" class="sub">style and typography</text>
  <text x="645" y="138" text-anchor="middle" class="sub">for every job</text>

  <path d="M85,258 L85,102 L158,102" class="line" marker-end="url(#arrow)"/>

  <path d="M245,180 L245,212" class="line" marker-end="url(#arrow)"/>
  <text x="255" y="201" class="note">guide every job</text>

  <!-- Step 1 -->
  <rect x="20" y="260" width="130" height="90" rx="8" class="human"/>
  <text x="85" y="292" text-anchor="middle" class="title">1. Branch</text>
  <text x="85" y="312" text-anchor="middle" class="sub">isolate the</text>
  <text x="85" y="328" text-anchor="middle" class="sub">translation work</text>

  <!-- Step 3: translate frame -->
  <rect x="166" y="214" width="308" height="152" rx="10" fill="#F6F8FB" stroke="#CBD5E1" stroke-width="1"/>
  <text x="180" y="242" class="title">3. Translate</text>

  <rect x="180" y="260" width="130" height="90" rx="8" class="ai"/>
  <text x="245" y="292" text-anchor="middle" class="title">Translation job</text>
  <text x="245" y="312" text-anchor="middle" class="sub">only missing and</text>
  <text x="245" y="328" text-anchor="middle" class="sub">changed topics</text>

  <rect x="330" y="260" width="130" height="90" rx="8" class="human"/>
  <text x="395" y="292" text-anchor="middle" class="title">Quick check</text>
  <text x="395" y="312" text-anchor="middle" class="sub">changed files,</text>
  <text x="395" y="328" text-anchor="middle" class="sub">valid DITA, commit</text>

  <!-- Step 4: review frame -->
  <rect x="490" y="214" width="308" height="152" rx="10" fill="#F6F8FB" stroke="#CBD5E1" stroke-width="1"/>
  <text x="504" y="242" class="title">4. Review</text>

  <rect x="504" y="260" width="130" height="90" rx="8" class="ai"/>
  <text x="569" y="292" text-anchor="middle" class="title">AI review</text>
  <text x="569" y="312" text-anchor="middle" class="sub">every topic,</text>
  <text x="569" y="328" text-anchor="middle" class="sub">root-cause report</text>

  <rect x="654" y="260" width="130" height="90" rx="8" class="human"/>
  <text x="719" y="292" text-anchor="middle" class="title">Expert review</text>
  <text x="719" y="312" text-anchor="middle" class="sub">meaning and style,</text>
  <text x="719" y="328" text-anchor="middle" class="sub">bilingual reviewer</text>

  <!-- Step 5 -->
  <rect x="824" y="260" width="166" height="90" rx="8" class="human"/>
  <text x="907" y="284" text-anchor="middle" class="title">5. Integrate</text>
  <text x="907" y="302" text-anchor="middle" class="title">and publish</text>
  <text x="907" y="322" text-anchor="middle" class="sub">merge, tag,</text>
  <text x="907" y="338" text-anchor="middle" class="sub">build deliverables</text>

  <path d="M310,305 L328,305" class="line" marker-end="url(#arrow)"/>
  <path d="M460,305 L502,305" class="line" marker-end="url(#arrow)"/>
  <path d="M634,305 L652,305" class="line" marker-end="url(#arrow)"/>
  <path d="M784,305 L822,305" class="line" marker-end="url(#arrow)"/>

  <!-- Quality loop -->
  <rect x="504" y="430" width="130" height="90" rx="8" class="fix"/>
  <text x="569" y="462" text-anchor="middle" class="title">Fix the cause</text>
  <text x="569" y="482" text-anchor="middle" class="sub">terms, UI strings,</text>
  <text x="569" y="498" text-anchor="middle" class="sub">rules, or the topic</text>

  <path d="M569,350 L569,428" class="loop" marker-end="url(#arrow-orange)"/>
  <path d="M719,350 L719,475 L636,475" class="loop" marker-end="url(#arrow-orange)"/>
  <text x="644" y="404" text-anchor="middle" class="note" fill="#C2410C">issues found</text>
  <path d="M504,475 L245,475 L245,352" class="loop" marker-end="url(#arrow-orange)"/>
  <text x="255" y="420" class="note" fill="#C2410C">retranslate</text>
  <text x="569" y="540" text-anchor="middle" class="label" fill="#C2410C">QUALITY LOOP</text>

  <!-- Release loop -->
  <path d="M907,350 L907,570 L85,570 L85,352" class="release" marker-end="url(#arrow)"/>
  <rect x="300" y="559" width="410" height="22" fill="#FFFFFF"/>
  <text x="505" y="575" text-anchor="middle" class="note">next release: only the topics whose source changed are translated again</text>
</svg>
